services:
  payments-postgres:
    image: postgres:16-alpine
    container_name: payments-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    # 5433 no host porque a 5432 ja esta ocupada pelo stack do evolution.
    ports:
      - "5433:5432"
    volumes:
      - payments-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: payments-api
    restart: unless-stopped
    environment:
      # Dentro da rede do compose o banco atende em payments-postgres:5432.
      SPRING_DATASOURCE_URL: jdbc:postgresql://payments-postgres:5432/payments
      SPRING_DATASOURCE_USERNAME: payments
      SPRING_DATASOURCE_PASSWORD: payments
    ports:
      - "8080:8080"
    depends_on:
      payments-postgres:
        condition: service_healthy

volumes:
  payments-pgdata:
